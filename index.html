  .wordmark{font-family:var(--serif); font-weight:600; letter-spacing:.12em; font-size:clamp(28px,8vw,40px); line-height:1;}
  .ksub{font-size:11.5px; letter-spacing:.34em; text-transform:uppercase; color:var(--ink-soft);}
  .wcap{font-size:13px; color:var(--ink-soft); margin-top:2px;} .wcap b{color:var(--accent-ink); font-weight:600;}
  .daynav{display:flex; align-items:center; justify-content:center; gap:14px; padding:11px 18px; position:sticky; top:0; z-index:5;
    background:rgba(251,245,236,.9); backdrop-filter:saturate(1.2) blur(8px); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .daynav .arrow{width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--accent-ink);
    font-size:18px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none;}
  .daynav .arrow:disabled{opacity:.35; cursor:default;}
  .daynav .arrow:hover:not(:disabled){border-color:var(--accent); color:var(--accent);}
  .navmid{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:170px;}
  .daylabel{font-size:13px; letter-spacing:.06em; color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums;}
  .dots{display:flex; gap:6px;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--line); border:0; padding:0; cursor:pointer;}
  .dot.on{background:var(--accent); transform:scale(1.25);}
  .deck{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; align-items:flex-start; scrollbar-width:none;}
  .deck::-webkit-scrollbar{display:none;}
  .day{min-width:100%; scroll-snap-align:start; box-sizing:border-box; padding:24px 18px 56px; display:flex; flex-direction:column; gap:32px;}
  @media (max-width:420px){ .day{padding:20px 14px 46px;} }
  .greet{font-family:var(--serif); font-size:19px; line-height:1.52; text-wrap:pretty;} .greet b{color:var(--accent-ink); font-weight:600;}
  .sec{display:flex; flex-direction:column; gap:15px;}

  .eyebrow .ic{width:17px; height:17px; color:var(--green);}
  .eyebrow.act{color:var(--accent-ink);} .eyebrow.act .ic{color:var(--accent);}
  .eyebrow::after{content:""; height:1px; flex:1; background:var(--line); margin-left:2px;}
  .cards{display:flex; flex-direction:column; gap:16px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 18px 20px; display:flex; flex-direction:column; gap:11px;

  .chead{display:flex; align-items:flex-start; gap:12px;}
  .badge{width:40px; height:40px; border-radius:10px; background:var(--accent-tint); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; flex:none;}
  .badge .ic{width:22px; height:22px;}
  .chead h3{font-family:var(--serif); font-size:20.5px; line-height:1.24; font-weight:600; text-wrap:balance; padding-top:3px;}
  .tag{align-self:flex-start; font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; font-weight:700; color:var(--accent-ink); background:var(--accent-tint); padding:3px 9px; border-radius:20px;}
  .card p{color:var(--ink);}
  .merk{display:flex; gap:10px; align-items:flex-start; background:var(--accent-tint); border-radius:9px; padding:11px 13px; font-size:15.5px; color:var(--accent-ink); line-height:1.45;}
  .merk.g{background:var(--green-tint); color:var(--green-ink);} .merk.g .ic{color:var(--green);}
  .merk .ic{width:19px; height:19px; margin-top:1px; color:var(--accent);}
  .konkret{font-size:15px; color:var(--ink-soft); border-left:2px solid var(--line); padding-left:12px;} .konkret b{color:var(--accent-ink); font-weight:600;}
  .src{font-size:12.5px; color:var(--ink-soft);} .src b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums;}
  .snippet .lab{font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--ink-soft); display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:8px;}
  .snippet pre{background:var(--snip); color:#EFE7D8; font-family:var(--mono); font-size:12.5px; line-height:1.55; padding:14px 15px; border-radius:8px; white-space:pre-wrap; word-break:break-word; tab-size:2;}
  .snippet pre .ph{color:#E0A85C;}
  .copy{font-family:var(--sans); font-size:11px; letter-spacing:.09em; text-transform:uppercase; font-weight:700; color:var(--accent-ink); background:transparent; border:1px solid var(--accent); border-radius:20px; padding:4px 11px; cursor:pointer;}

  .copy:focus-visible,a:focus-visible,.arrow:focus-visible,.dot:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .also{font-size:14.5px; color:var(--ink-soft);} .also b{color:var(--ink); font-weight:600;}

  .story p{font-size:15.5px;} .story + .story{border-top:1px solid var(--line); padding-top:15px;}
  .story .photo{width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:9px; margin-bottom:4px; background:var(--line); display:block;}
  .opp{background:var(--green-tint); border:1px solid #D9E8E2; border-radius:12px; padding:16px 17px; display:flex; flex-direction:column; gap:9px;}
  .opp h4{font-family:var(--serif); font-size:19px; font-weight:600; line-height:1.28;} .opp .why{font-size:14.5px; color:var(--green-ink); font-weight:600;}

  .thought{font-family:var(--serif); font-style:italic; font-size:18.5px; line-height:1.5; text-align:center; text-wrap:balance; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:22px 6px; color:var(--ink);}
  .actbar{text-align:center; font-size:12px; letter-spacing:.22em; text-transform:uppercase; font-weight:700; color:var(--accent-ink);}
  .colophon{text-align:center; font-size:12px; letter-spacing:.05em; color:var(--ink-soft); line-height:1.7;} .colophon .mk{font-family:var(--serif); letter-spacing:.12em; color:var(--ink); font-weight:600;}
</style>
</head>

function ic(n){ return '<svg class="ic" viewBox="0 0 24 24">'+(ICONS[n]||ICONS.spark)+'</svg>'; }
function src(it){ var s=it.url? '<a href="'+it.url+'">'+it.source+'</a>' : it.source; return '<p class="src">Quelle: '+s+(it.score?' · Werte-Score <b>'+it.score+'</b>':'')+'</p>'; }
function merk(text,tone){ return '<div class="merk'+(tone==='g'?' g':'')+'">'+ic('spark')+'<span><b>Merksatz:</b> '+text+'</span></div>'; }
function story(it){ return '<div class="story">'+(it.img?'<img class="photo" src="'+it.img+'" alt="" loading="lazy">':'')+'<h4>'+it.title+'</h4><p>'+it.text+'</p>'+src(it)+'</div>'; }
function card(c){
  var h='<article class="card"><div class="chead"><div class="badge">'+ic(c.icon||'gauge')+'</div><h3>'+c.title+'</h3></div>';
  if(c.tag) h+='<span class="tag">'+c.tag+'</span>';
  h+=(c.paras||[]).map(function(p){return '<p>'+p+'</p>';}).join('');
  if(c.merk) h+=merk(c.merk);
  if(c.konkret) h+='<p class="konkret"><b>Konkret:</b> '+c.konkret+'</p>';
  if(c.snippet) h+='<div class="snippet"><div class="lab"><span>'+(c.snippetLabel||'Prompt-Snippet')+'</span><button class="copy" data-copy>Kopieren</button></div><pre>'+c.snippet+'</pre></div>';
  if(c.source) h+=src(c);
  return h+'</article>';
}
function section(s){
  if(s.type==='news') return '<section class="sec"><div class="eyebrow">'+ic(s.icon)+s.eyebrow+'</div><div class="stories">'+s.items.map(story).join('')+'</div>'+(s.merk?merk(s.merk.text,s.merk.tone):'')+'</section>';
  if(s.type==='opp'){ var it=s.item; return '<section class="sec"><div class="eyebrow act">'+ic(s.icon)+s.eyebrow+'</div><div class="opp"><h4>'+it.title+'</h4><p>'+it.text+'</p><p class="why">↳ '+it.why+'</p>'+src(it)+'</div></section>'; }
  if(s.type==='action') return '<section class="sec"><div class="eyebrow act">'+ic(s.icon)+s.eyebrow+'</div><div class="cards">'+s.cards.map(card).join('')+(s.also?'<p class="also"><b>Auch aufgeschnappt:</b> '+s.also+'</p>':'')+'</div></section>';
  if(s.type==='thought') return '<p class="thought">„'+s.text+'"</p>';
  if(s.type==='divider') return '<div class="actbar">— '+(s.text||'Was du daraus machen kannst')+' —</div>';
  return '';
}
function day(d){
  return '<section class="day" data-label="'+d.label+'" data-w="'+d.weather+'" data-temp="'+d.temp+'"><p class="greet">'+d.greeting+'</p>'
    + d.sections.map(section).join('')
    + (d.colophon?'<footer class="colophon"><span class="mk">MORGENLAGE</span> · '+d.colophon+'<br>wische für die Vortage</footer>':'') + '</section>';
}

var hero=document.querySelector('.hero'), wtemp=document.querySelector('.wtemp'), sub=document.querySelector('[data-sub]');
var deck=document.querySelector('.deck'), dotsWrap=document.querySelector('.dots'), label=document.querySelector('.daylabel');
var prev=document.querySelector('.arrow.prev'), next=document.querySelector('.arrow.next');
var days=[];
function active(){ return Math.max(0,Math.min(days.length-1,Math.round(deck.scrollLeft/deck.clientWidth))); }
function sync(){ var i=active(), d=days[i]; if(!d) return;
  [].forEach.call(dotsWrap.children,function(x,n){ x.classList.toggle('on',n===i); });
  label.textContent=d.getAttribute('data-label'); wtemp.textContent=d.getAttribute('data-temp'); hero.setAttribute('data-w',d.getAttribute('data-w'));
  prev.disabled=(i<=0); next.disabled=(i>=days.length-1);
}
function go(i){ i=Math.max(0,Math.min(days.length-1,i)); deck.scrollTo({left:i*deck.clientWidth,behavior:'smooth'}); }
function build(data){
  if(data.sub) sub.textContent=data.sub;
  deck.innerHTML=data.days.map(day).join('');
  dotsWrap.innerHTML=data.days.map(function(_,n){return '<button class="dot" data-go="'+n+'" aria-label="Tag '+(n+1)+'"></button>';}).join('');
  days=[].slice.call(deck.querySelectorAll('.day'));
  [].forEach.call(dotsWrap.children,function(b){ b.addEventListener('click',function(){ go(+b.getAttribute('data-go')); }); });
  deck.querySelectorAll('.copy[data-copy]').forEach(function(btn){ btn.addEventListener('click',function(){
    var pre=btn.closest('.snippet').querySelector('pre');
    navigator.clipboard.writeText(pre.innerText).then(function(){ var o=btn.textContent; btn.textContent='Kopiert'; btn.classList.add('ok'); setTimeout(function(){btn.textContent=o;btn.classList.remove('ok');},1600); }).catch(function(){});
  }); });
  var last=days.length-1; deck.scrollLeft=last*deck.clientWidth; sync();
}
prev.addEventListener('click',function(){ go(active()-1); });
next.addEventListener('click',function(){ go(active()+1); });
var t; deck.addEventListener('scroll',function(){ clearTimeout(t); t=setTimeout(sync,60); });
window.addEventListener('resize',function(){ go(active()); });
fetch('data.json',{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(build).catch(function(){ build(window.__DATA__); });
</script>
